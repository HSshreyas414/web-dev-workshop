<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Object</h2>
<p>Object creation using key value pair</p>

<script>

	var my_car = {make: "Honda", model: "Accord"}; 
	document.write ( "Car Make:" + my_car.make + "<br/>") ;
	document.write ( "Car Model:" + my_car["model"] + "<br/>") ;
</script>

</body>
</html>
