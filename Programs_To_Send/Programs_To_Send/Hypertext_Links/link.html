<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hypertext Links Example</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>HTML Hyperlinks</h1>

    <p>Visit <a href="https://www.wikipedia.org" target="_blank">Wikipedia</a> to explore knowledge.</p>

    <p>Jump to our <a href="#contact">Contact Section</a> below.</p>

    <!-- Spacer to simulate a long scroll -->
    <div class="spacer"></div>

    <hr>

    <!-- Contact section at the very bottom -->
    <footer id="contact">
        <h2>Contact Section</h2>
        <p>Email us at <a href="mailto:info@example.com">info@example.com</a></p>
    </footer>
</body>
</html>
