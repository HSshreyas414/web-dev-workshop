
<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Object</h2>
<p>Object within Object</p>

<script>

	var my_car = new Object();		// Create an Object object
	my_car.engine = new Object();
	my_car.engine.config = "V6";
	my_car.engine.hp = 263;
	document.write ( "Car Engine Configuration:" + my_car.engine.config + "<br/>") ;
	document.write ( "Car Engine Hp:" + my_car.engine.hp + "<br/>") ;
</script>

</body>
</html>
