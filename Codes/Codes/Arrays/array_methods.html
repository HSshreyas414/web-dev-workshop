<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Arrays</h1>
<!--length() method-->
<h2>The length Property</h2>
<p><em></em>The length property returns the length of an array:</em></p>
<p id="demo"></p>

<!--tostring() method-->
<h2>The toString() Method</h2>
<p><em></em>The toString() method returns an array as a comma separated string:</em></p>
<p id="demo1"></p>
<script>
const fruits = ["Banana", "Orange", "Apple", "Mango"];
let size = fruits.length;
document.getElementById("demo").innerHTML = size;

const cars = [" SUV", " BMW", " Audi"];
document.getElementById("demo1").innerHTML = cars.toString();


</script>

</body>
</html>
