<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Embedding Example</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>Embedding an Image in HTML</h1>

    <div class="image-container">
        <img 
            src="Scenic_View.jpg" 
            alt="Scenic view of nature with mountains and a lake" 
            width="400" 
            height="250" 
            title="Beautiful Nature Scene">
        <p>This image shows a serene natural landscape, embedded with helpful attributes.</p>
    </div>
</body>
</html>
