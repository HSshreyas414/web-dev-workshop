<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unordered List</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>Unordered List</h1>
    <ul>
        <li>Fruits
            <ul class="nested">
                <li>Apple</li>
                <li>Banana</li>
                <li>Orange</li>
            </ul>
        </li>
        <li>Vegetables
            <ol class="nested">
                <li>Carrot</li>
                <li>Broccoli</li>
            </ol>
        </li>
    </ul>
</body>
</html>
