<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table with Colspan and Rowspan</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>Table with Colspan and Rowspan</h1>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Laptop</td>
                <td>Electronics</td>
                <td>$800</td>
            </tr>
            <tr>
                <td>Accessories</td>
                <td>$50</td>
            </tr>
            <tr>
                <td>Smartphone</td>
                <td>Electronics</td>
                <td>$600</td>
            </tr>
            <tr>
                <td>Tablet</td>
                <td>Electronics</td>
                <td>$300</td>
            </tr>
            <tr>
                <td colspan="2">Headphones</td>
                <td>$100</td>
            </tr>
            <tr>
                <td colspan="2">Charger</td>
                <td>$20</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
