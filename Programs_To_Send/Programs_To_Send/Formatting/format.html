<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Formatting in HTML</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>HTML Text Formatting</h1>

    <p>This is <b>bold text</b> using the <code>&lt;b&gt;</code> tag.</p>
    <p>This is <strong>strong text</strong> using the <code>&lt;strong&gt;</code> tag.</p>
    <p>This is <i>italic text</i> using the <code>&lt;i&gt;</code> tag.</p>
    <p>This is <em>emphasized text</em> using the <code>&lt;em&gt;</code> tag.</p>
</body>
</html>
