<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Form Example</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>Simple Form Example</h1>

    <form action="#" method="POST" class="form-container">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="gender">Gender:</label>
            <label for="male"><input type="radio" id="male" name="gender" value="male">
            Male</label>
            <label for="female"><input type="radio" id="female" name="gender" value="female">
            Female</label>
        </div>

        <div class="form-group">
            <label for="newsletter">Subscribe to Newsletter:</label>
            <input type="checkbox" id="newsletter" name="newsletter">
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
