<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Control Statements</title>
</head>
<body>

<h2>JavaScript Control Statements</h2>
<button onclick="runDemo()">Run for result</button>

<pre id="output"></pre>

<script>
function runDemo() {
  let result = "";

  // IF / ELSE
  let num = 5;
  if (num > 0) {
    result += "if/else: Number is positive\n";
  } else {
    result += "if/else: Number is negative\n";
  }

  // SWITCH
  let color = "red";
  switch (color) {
    case "red":
      result += "switch: Color is red\n";
      break;
    case "blue":
      result += "switch: Color is blue\n";
      break;
    default:
      result += "switch: Color is something else\n";
  }

  // FOR LOOP
  result += "for loop: ";
  for (let i = 1; i <= 3; i++) {
    result += i + " ";
  }
  result += "\n";

  // WHILE LOOP
  result += "while loop: ";
  let count = 1;
  while (count <= 3) {
    result += count + " ";
    count++;
  }
  result += "\n";

  // DO...WHILE LOOP
  result += "do...while loop: ";
  let k = 1;
  do {
    result += k + " ";
    k++;
  } while (k <= 3);
  result += "\n";

  // BREAK AND CONTINUE
  result += "for loop with break/continue: ";
  for (let j = 1; j <= 5; j++) {
    if (j == 2) continue;  // skip 2
    if (j == 4) break;     // stop at 4
    result += j + " ";
  }

  document.getElementById("output").textContent = result;
}
</script>

</body>
</html>
