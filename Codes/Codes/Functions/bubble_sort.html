<!DOCTYPE html>
<html>
<head>
    <title>Bubble Sort in JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input, button {
            padding: 8px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
    <script>
        function bubbleSort() {
            let input = document.getElementById("numbers").value;
            let arr = input.split(",").map(Number);

            if (arr.some(isNaN)) {
                document.getElementById("result").innerText = "Please enter valid numbers separated by commas.";
                return;
            }

            let n = arr.length;
            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    if (arr[j] > arr[j + 1]) {
                        // Swap
                        let temp = arr[j];
                        arr[j] = arr[j + 1];
                        arr[j + 1] = temp;
                    }
                }
            }

            document.getElementById("result").innerText = "Sorted Array: " + arr.join(", ");
        }
    </script>
</head>
<body>
    <h1>Bubble Sort Program</h1>
    <p>Enter numbers separated by commas (e.g., 5,2,9,1,3):</p>
    <input type="text" id="numbers" placeholder="Enter numbers here">
    <button onclick="bubbleSort()">Sort</button>

    <div id="result"></div>
</body>
</html>
