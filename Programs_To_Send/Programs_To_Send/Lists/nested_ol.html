<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ordered List</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>Ordered List</h1>
    <ol>
        <li>Plan
            <ul class="nested">
                <li>Research</li>
                <li>Strategy</li>
            </ul>
        </li>
        <li>Develop
            <ol class="nested">
                <li>Coding</li>
                <li>Testing</li>
            </ol>
        </li>
        <li>Launch</li>
    </ol>
</body>
</html>
