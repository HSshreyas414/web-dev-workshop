<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block vs Inline Elements</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>Block vs Inline Elements</h1>

    <section class="block-example">
        <h2>Block Elements</h2>
        <div class="box">This is a &lt;div&gt; (block)</div>
        <p>This is a &lt;p&gt; (block)</p>
        <h3>This is a &lt;h3&gt; (block)</h3>
    </section>

    <section class="inline-example">
        <h2>Inline Elements</h2>
        <p>
            <span class="highlight">&lt;span&gt; (inline)</span> sits 
            <strong class="highlight">&lt;strong&gt; (inline)</strong> inside 
            a paragraph <em class="highlight">&lt;em&gt; (inline)</em> without breaking lines.
        </p>
    </section>
</body>
</html>
